# Memoria para el proceso de Gradle (ajusta si tu PC tiene poca RAM)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Usa AndroidX en lugar de las librerías de soporte antiguas
android.useAndroidX=true

# Kotlin genera código de forma incremental (compila más rápido)
kotlin.incremental=true

# Habilita el caché de configuración de Gradle (builds más rápidos)
org.gradle.caching=true

# Evita que Gradle regenere R.java completo en cada build
android.nonTransitiveRClass=true

# Suprime advertencia de compatibilidad KMP con AGP
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
kotlin.native.ignoreDisabledTargets=true
